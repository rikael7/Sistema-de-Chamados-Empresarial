<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallSystem — Entrar</title>

    <style>
      :root {
        /* =========================
       CORES
       ========================= */

        --bg: #faf9f5;
        --surface: #ffffff;
        --surface-soft: #f5f4ed;

        --text: #141413;
        --text-secondary: #5f5e59;
        --text-muted: #87867f;

        --border: #e6e4dc;
        --border-strong: #d8d6ce;

        --primary: #c96442;
        --primary-hover: #b95739;
        --primary-soft: #f8ebe5;

        --focus: #3898ec;

        --error: #b53333;
        --error-bg: #fbeceb;

        --success: #467a4a;
        --success-bg: #eaf4ea;

        /* =========================
       MEDIDAS
       ========================= */

        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;

        /* =========================
       TIPOGRAFIA
       ========================= */

        --font-serif: Georgia, "Times New Roman", serif;

        --font-sans:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }

      .card-wrap {
        width: 100%;
        height: 100%;
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;
        overflow: hidden;
      }

      /* =========================
     TOPO
     ========================= */

      .topbar {
        width: 100%;
        max-width: 1500px;

        padding: 32px 40px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;

        color: var(--text);

        font-family: var(--font-serif);
        font-size: 21px;
        font-weight: 400;
        letter-spacing: -0.015em;
      }

      .logo svg {
        flex-shrink: 0;
      }

      /* =========================
     ÁREA PRINCIPAL
     ========================= */

      .card-wrap {
        flex: 1;

        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px 20px 80px;
      }

      /* =========================
     CARD
     ========================= */

      .card {
        width: 100%;
        max-width: 760px;
        padding: 48px 52px 44px;

        background: var(--surface);

        border: 1px solid var(--border);
        border-radius: var(--radius-xl);

        box-shadow:
          0 1px 2px rgba(20, 20, 19, 0.03),
          0 10px 35px rgba(20, 20, 19, 0.145);

        animation: card-enter 0.25s ease-out;
      }

      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =========================
     TEXTO AUXILIAR
     ========================= */

      .eyebrow {
        margin-bottom: 8px;

        color: var(--text-muted);

        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;

        letter-spacing: normal;
      }

      /* =========================
     TÍTULO
     ========================= */

      h1 {
        margin-bottom: 32px;

        color: var(--text);

        font-family: var(--font-serif);

        font-size: 34px;
        font-weight: 400;

        line-height: 1.1;

        letter-spacing: -0.025em;
      }

      /* =========================
     CAMPOS
     ========================= */

      .field {
        width: 100%;

        margin-bottom: 16px;

        padding: 12px 14px;

        background: var(--surface);

        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);

        color: var(--text);

        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;

        outline: none;

        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background-color 0.15s ease;
      }

      .field::placeholder {
        color: #99978f;
      }

      .field:hover {
        border-color: #c9c7bf;
      }

      .field:focus {
        border-color: var(--focus);

        box-shadow: 0 0 0 3px rgba(56, 152, 236, 0.12);
      }

      .field.error {
        border-color: var(--error);
      }

      .error-msg {
        display: none;

        margin: -9px 0 14px;

        color: var(--error);

        font-family: var(--font-sans);
        font-size: 12px;
        line-height: 1.45;
      }

      /* =========================
     OPÇÕES
     ========================= */

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 16px;

        margin-bottom: 28px;
      }

      .remember {
        display: flex;
        align-items: center;

        gap: 8px;

        color: var(--text-secondary);

        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;

        cursor: pointer;
        user-select: none;
      }

      .remember input {
        width: 16px;
        height: 16px;

        margin: 0;

        border-radius: 4px;

        accent-color: var(--primary);

        cursor: pointer;
      }

      .forgot {
        padding: 0;

        background: none;
        border: none;

        color: var(--text-secondary);

        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;

        text-decoration: none;

        cursor: pointer;

        transition: color 0.15s ease;
      }

      .forgot:hover {
        color: var(--text);
        text-decoration: underline;
      }

      .forgot:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 3px;
      }

      /* =========================
     BOTÃO PRINCIPAL
     ========================= */

      .btn-primary {
        width: 100%;

        min-height: 44px;

        padding: 11px 16px;

        margin-bottom: 12px;

        background: var(--primary);
        color: #fff;

        border: 1px solid var(--primary);
        border-radius: var(--radius-md);

        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.4;
        font-weight: 600;

        cursor: pointer;

        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          transform 0.05s ease;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-primary:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .btn-primary:disabled {
        background: #d8a796;
        border-color: #d8a796;

        cursor: not-allowed;
      }

      /* =========================
     GOOGLE
     ========================= */

      .btn-google {
        width: 100%;

        min-height: 44px;

        padding: 10px 14px;

        margin-bottom: 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 10px;

        background: var(--surface);
        color: var(--text);

        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);

        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.4;
        font-weight: 500;

        cursor: pointer;

        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-google:hover {
        background: var(--surface-soft);
        border-color: #c9c7bf;
      }

      .btn-google:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      /* =========================
     RECRUTADOR
     ========================= */

      .btn-recruiter {
        width: 100%;

        min-height: 44px;

        padding: 10px 14px;

        margin-bottom: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        background: var(--primary-soft);
        color: var(--text);

        border: 1px dashed #d9a391;
        border-radius: var(--radius-md);

        font-family: var(--font-sans);
        font-size: 13.5px;
        line-height: 1.4;
        font-weight: 500;

        cursor: pointer;

        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .btn-recruiter:hover {
        background: #f5e3dc;
        border-color: #c96442;
      }

      .btn-recruiter:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .btn-recruiter svg {
        flex-shrink: 0;
      }

      /* =========================
     RODAPÉ
     ========================= */

      .footer-text {
        text-align: center;

        color: var(--text-muted);

        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
      }

      .footer-text a {
        color: var(--text);

        font-weight: 500;

        text-decoration: underline;
        text-underline-offset: 2px;

        transition: color 0.15s ease;
      }

      .footer-text a:hover {
        color: var(--primary);
      }

      /* =========================
     MENSAGEM DO SERVIDOR
     ========================= */

      .server-msg {
        display: none;

        margin-bottom: 16px;

        padding: 10px 12px;

        border-radius: var(--radius-md);

        font-family: var(--font-sans);
        font-size: 12.5px;
        line-height: 1.5;

        text-align: center;
      }

      .server-msg.error {
        display: block;

        background: var(--error-bg);
        color: var(--error);

        border: 1px solid #efcfcc;
      }

      .server-msg.success {
        display: block;

        background: var(--success-bg);
        color: var(--success);

        border: 1px solid #cfe2cf;
      }

      /* =========================
     RESPONSIVIDADE
     ========================= */

      @media (max-width: 700px) {
        .topbar {
          padding: 24px;
        }

        .card-wrap {
          align-items: flex-start;

          padding: 20px 16px 48px;
        }

        .card {
          max-width: 440px;

          padding: 40px 28px 36px;
        }

        h1 {
          font-size: 30px;
        }
      }

      @media (max-width: 480px) {
        .topbar {
          padding: 20px;
        }

        .logo {
          font-size: 19px;
        }

        .card-wrap {
          padding: 12px 12px 36px;
        }

        .card {
          padding: 32px 22px 30px;

          border-radius: var(--radius-lg);
        }

        h1 {
          font-size: 28px;
          margin-bottom: 28px;
        }

        .row {
          align-items: flex-start;
          flex-direction: column;

          gap: 12px;

          margin-bottom: 24px;
        }

        .forgot {
          align-self: flex-end;
        }
      }

      @media (max-width: 360px) {
        .card {
          padding: 28px 18px 26px;
        }

        h1 {
          font-size: 26px;
        }

        .field,
        .btn-primary,
        .btn-google,
        .btn-recruiter {
          font-size: 13.5px;
        }
      }

      /* =========================
     REDUÇÃO DE MOVIMENTO
     ========================= */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="card-wrap">
      <div class="card">
        <h1>Bem vindo de volta</h1>
        <div id="serverMsg" class="server-msg"></div>
        <form id="loginForm" novalidate>
          <input
            type="email"
            id="email"
            name="email"
            class="field"
            placeholder="Digite seu Email "
            autocomplete="email"
            required
          />

          <div class="error-msg" id="emailError">Informe um e-mail válido.</div>

          <input
            type="password"
            id="password"
            name="password"
            class="field"
            placeholder="Senha"
            autocomplete="current-password"
            required
          />

          <div class="error-msg" id="passwordError">A senha é obrigatória.</div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" name="remember" />
              Preencher dados automáticos
            </label>

            <button type="button" class="forgot" id="forgotBtn">
              Esqueci minha senha
            </button>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            Login
          </button>
        </form>

        <div>
          <button type="button" class="btn-google" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path
                fill="#4285F4"
                d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"
              />
              <path
                fill="#34A853"
                d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"
              />
              <path
                fill="#FBBC05"
                d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.34z"
              />
              <path
                fill="#EA4335"
                d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"
              />
            </svg>

            Entre com sua conta Google
          </button>
        </div>

        <button
          type="button"
          class="btn-recruiter"
          id="recruiterBtn"
          title="Preencher dados de acesso do recrutador"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#3b6df0"
            stroke-width="2"
          >
            <rect x="3" y="7" width="18" height="13" rx="2" />

            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>

          Login como recrutador
        </button>

        <div class="footer-text">
          Não tem uma conta?
          <a href="/register">registrar</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");

      const emailInput = document.getElementById("email");

      const passwordInput = document.getElementById("password");

      const emailError = document.getElementById("emailError");

      const passwordError = document.getElementById("passwordError");

      const submitBtn = document.getElementById("submitBtn");

      const serverMsg = document.getElementById("serverMsg");

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      function showServerMsg(text, type) {
        serverMsg.textContent = text;
        serverMsg.className = "server-msg " + type;
      }

      // LOGIN NORMAL
      // O login só acontece quando o usuário clica no botão "Login".
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        serverMsg.className = "server-msg";

        let valid = true;

        // Validação do e-mail
        if (!isValidEmail(emailInput.value.trim())) {
          emailInput.classList.add("error");

          emailError.style.display = "block";

          valid = false;
        } else {
          emailInput.classList.remove("error");

          emailError.style.display = "none";
        }

        // Validação da senha
        if (!passwordInput.value) {
          passwordInput.classList.add("error");

          passwordError.style.display = "block";

          valid = false;
        } else {
          passwordInput.classList.remove("error");

          passwordError.style.display = "none";
        }

        if (!valid) return;

        submitBtn.disabled = true;

        submitBtn.textContent = "Entrando...";

        try {
          const res = await fetch("/auth/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            credentials: "include",

            body: JSON.stringify({
              email: emailInput.value.trim().toLowerCase(),

              password: passwordInput.value,

              remember: document.getElementById("remember").checked,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showServerMsg(
              "Login realizado com sucesso! Redirecionando...",
              "success",
            );

            window.location.href = data.redirectTo || "/";
          } else {
            showServerMsg(
              data.message || "Credenciais inválidas. Tente novamente.",
              "error",
            );
          }
        } catch (err) {
          console.error(err);

          showServerMsg(
            "Erro de conexão com o servidor. Tente novamente.",
            "error",
          );
        } finally {
          submitBtn.disabled = false;

          submitBtn.textContent = "Login";
        }
      });

      // ESQUECI MINHA SENHA
      document.getElementById("forgotBtn").addEventListener("click", () => {
        window.location.href = "/#";
      });

      // LOGIN GOOGLE
      document.getElementById("googleBtn").addEventListener("click", () => {
        window.location.href = "/auth/google";
      });

      // =========================================================
      // LOGIN COMO RECRUTADOR
      // =========================================================
      //
      // IMPORTANTE:
      // Este botão NÃO realiza login.
      //
      // Ele apenas preenche automaticamente os campos de
      // e-mail e senha.
      //
      // O usuário precisa clicar manualmente no botão "Login"
      // para que o formulário seja enviado.
      // =========================================================

      document.getElementById("recruiterBtn").addEventListener("click", () => {
        emailInput.value = "recrutadorderikael@outlook.com";

        passwordInput.value = "Bemvindo548";

        // Remove possíveis erros anteriores
        emailInput.classList.remove("error");

        passwordInput.classList.remove("error");

        emailError.style.display = "none";

        passwordError.style.display = "none";

        // Limpa mensagens anteriores
        serverMsg.className = "server-msg";

        // Garante que o botão Login esteja disponível
        submitBtn.disabled = false;

        submitBtn.textContent = "Login";

        // Coloca o foco no botão Login para deixar claro
        // que o próximo passo depende do usuário.
        submitBtn.focus();
      });
    </script>
  </body>
</html>
