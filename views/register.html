<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallSys — Criar conta</title>
    <style>
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --text: #252421;
        --muted: #77736c;
        --border: #dedbd4;
        --border-hover: #c8c4bb;
        --accent: #d97757;
        --accent-hover: #c96748;
        --accent-text: #ffffff;

        --error: #b94a3c;
        --error-bg: #fdf1ee;

        --success: #36745b;
        --success-bg: #edf7f1;

        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        min-height: 100vh;

        background: var(--bg);
        color: var(--text);

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 32px 20px;
      }

      /* =========================
     CONTAINER
     ========================= */

      .card-wrap {
        width: 100%;
        min-height: calc(100vh - 64px);

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 100%;
        max-width: 760px;

        background: var(--surface);

        padding: 42px 40px 36px;

        border: 1px solid rgba(37, 36, 33, 0.08);

        border-radius: 16px;

        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.03),
          0 10px 35px rgba(0, 0, 0, 0.145);
      }

      /* =========================
     TITLE
     ========================= */

      .card h1 {
        margin: 0 0 30px;

        color: var(--text);

        font-family: Georgia, "Times New Roman", serif;

        font-size: 31px;
        font-weight: 400;
        line-height: 1.18;
        letter-spacing: -0.7px;

        text-align: center;
      }

      /* =========================
     SERVER MESSAGE
     ========================= */

      .server-msg {
        display: none;

        margin: 0 0 18px;
        padding: 11px 13px;

        border-radius: 9px;

        font-size: 14px;
        line-height: 1.45;
      }

      .server-msg.success {
        display: block;

        color: var(--success);
        background: var(--success-bg);
        border: 1px solid #d7eadf;
      }

      .server-msg.error {
        display: block;

        color: var(--error);
        background: var(--error-bg);
        border: 1px solid #f0d5cf;
      }

      /* =========================
     FORM
     ========================= */

      #signupForm {
        width: 100%;
      }

      /* =========================
     INPUTS
     ========================= */

      .field {
        width: 100%;
        height: 48px;

        margin: 0 0 7px;
        padding: 0 15px;

        appearance: none;

        border: 1px solid var(--border);
        border-radius: 9px;

        background: #fff;
        color: var(--text);

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;

        font-size: 15px;
        line-height: 1;

        outline: none;

        transition:
          border-color 150ms ease,
          box-shadow 150ms ease,
          background 150ms ease;
      }

      .field::placeholder {
        color: #918d85;
        opacity: 1;
      }

      .field:hover {
        border-color: var(--border-hover);
      }

      .field:focus {
        border-color: #b9b4aa;

        box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.1);
      }

      .field.error {
        border-color: var(--error);
        background: #fffdfc;
      }

      .field.error:focus {
        box-shadow: 0 0 0 3px rgba(185, 74, 60, 0.1);
      }

      /* =========================
     HINT
     ========================= */

      .hint {
        margin: 1px 0 17px;
        padding-left: 2px;

        color: var(--muted);

        font-size: 12.5px;
        line-height: 1.4;
      }

      /* =========================
     ERRORS
     ========================= */

      .error-msg {
        display: none;

        margin: 0 0 14px;
        padding-left: 2px;

        color: var(--error);

        font-size: 12.5px;
        line-height: 1.4;
      }

      /* Quando o erro aparece antes do próximo campo */
      .field.error + .error-msg {
        margin-bottom: 14px;
      }

      /* =========================
     TERMS
     ========================= */

      .row {
        margin-top: 5px;
        margin-bottom: 22px;
      }

      .terms {
        display: flex;
        align-items: flex-start;
        gap: 9px;

        color: #6f6b64;

        font-size: 13px;
        line-height: 1.45;

        cursor: pointer;
        user-select: none;
      }

      .terms input {
        width: 16px;
        height: 16px;

        margin: 1px 0 0;

        flex: 0 0 auto;

        appearance: none;

        background: #fff;

        border: 1px solid #c9c5bd;
        border-radius: 4px;

        cursor: pointer;

        position: relative;

        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .terms input:hover {
        border-color: #a9a49b;
      }

      .terms input:checked {
        background: var(--accent);
        border-color: var(--accent);
      }

      .terms input:checked::after {
        content: "";

        position: absolute;

        width: 4px;
        height: 8px;

        left: 5px;
        top: 2px;

        border-right: 2px solid white;
        border-bottom: 2px solid white;

        transform: rotate(45deg);
      }

      .terms a {
        color: var(--text);

        text-decoration: underline;
        text-decoration-color: #bcb8b0;
        text-underline-offset: 2px;

        transition:
          color 150ms ease,
          text-decoration-color 150ms ease;
      }

      .terms a:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      /* =========================
     PRIMARY BUTTON
     ========================= */

      .btn-primary {
        width: 100%;
        height: 48px;

        border: 0;
        border-radius: 9px;

        background: var(--accent);
        color: var(--accent-text);

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
          background 150ms ease,
          transform 100ms ease,
          opacity 150ms ease;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-primary:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      /* =========================
     GOOGLE BUTTON
     ========================= */

      .btn-google {
        width: 100%;
        height: 48px;

        margin-top: 11px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        border: 1px solid var(--border);
        border-radius: 9px;

        background: #fff;
        color: #35332f;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;

        font-size: 14px;
        font-weight: 500;

        cursor: pointer;

        transition:
          background 150ms ease,
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      .btn-google:hover {
        background: #faf9f6;
        border-color: var(--border-hover);

        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
      }

      .btn-google:active {
        background: #f5f3ef;
      }

      .btn-google svg {
        flex: 0 0 auto;
      }

      /* =========================
     FOOTER
     ========================= */

      .footer-text {
        margin-top: 27px;

        color: #817d75;

        font-size: 13px;
        line-height: 1.5;

        text-align: center;
      }

      .footer-text a {
        color: var(--text);

        font-weight: 500;

        text-decoration: underline;
        text-decoration-color: #bbb7af;
        text-underline-offset: 2px;

        transition:
          color 150ms ease,
          text-decoration-color 150ms ease;
      }

      .footer-text a:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      /* =========================
     MOBILE
     ========================= */

      @media (max-width: 600px) {
        body {
          padding: 0;

          align-items: flex-start;

          background: var(--surface);
        }

        .card-wrap {
          min-height: 100vh;

          align-items: flex-start;

          padding: 34px 20px 28px;
        }

        .card {
          max-width: 430px;

          padding: 28px 0 24px;

          border: 0;
          border-radius: 0;

          box-shadow: none;
        }

        .card h1 {
          margin-bottom: 28px;

          font-size: 29px;
        }
      }

      @media (max-width: 380px) {
        .card-wrap {
          padding-left: 16px;
          padding-right: 16px;
        }

        .card h1 {
          font-size: 27px;
        }

        .field,
        .btn-primary,
        .btn-google {
          height: 46px;
        }
      }

      /* =========================
     REDUCED MOTION
     ========================= */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card-wrap">
      <div class="card">
        <h1>Criar uma conta</h1>

        <div id="serverMsg" class="server-msg"></div>

        <form id="signupForm" novalidate>
          <input
            type="text"
            id="name"
            name="name"
            class="field"
            placeholder="Nome completo"
            autocomplete="name"
            required
          />
          <div class="error-msg" id="nameError">Informe seu nome completo.</div>

          <input
            type="email"
            id="email"
            name="email"
            class="field"
            placeholder="Email "
            autocomplete="email"
            required
          />
          <div class="error-msg" id="emailError">Informe um e-mail válido.</div>

          <input
            type="password"
            id="password"
            name="password"
            class="field"
            placeholder="Senha"
            autocomplete="new-password"
            required
          />
          <div class="hint">Mínimo de 8 caracteres.</div>
          <div class="error-msg" id="passwordError">
            A senha precisa ter no mínimo 8 caracteres.
          </div>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="field"
            placeholder="Confirmar sua senha"
            autocomplete="new-password"
            required
          />
          <div class="error-msg" id="confirmError">
            As senhas não coincidem.
          </div>

          <div class="row">
            <label class="terms">
              <input type="checkbox" id="terms" name="terms" />
              <span>Eu concordo com os <a href="#">Termos de uso</a></span>
            </label>
          </div>
          <div class="error-msg" id="termsError" style="margin-top: -20px">
            Você precisa aceitar os termos para continuar.
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            Criar Conta
          </button>
        </form>

        <button type="button" class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"
            />
            <path
              fill="#FBBC05"
              d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.34z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"
            />
          </svg>
          Entre com sua conta Google
        </button>

        <div class="footer-text">
          Já tem uma conta? <a href="/login">Login</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("signupForm");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const termsInput = document.getElementById("terms");

      const nameError = document.getElementById("nameError");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const confirmError = document.getElementById("confirmError");
      const termsError = document.getElementById("termsError");

      const submitBtn = document.getElementById("submitBtn");
      const serverMsg = document.getElementById("serverMsg");

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      function showServerMsg(text, type) {
        serverMsg.textContent = text;
        serverMsg.className = "server-msg " + type;
      }

      function setFieldError(input, errorEl, hasError) {
        input.classList.toggle("error", hasError);
        errorEl.style.display = hasError ? "block" : "none";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        serverMsg.className = "server-msg";

        let valid = true;

        const nameOk = nameInput.value.trim().length >= 2;
        setFieldError(nameInput, nameError, !nameOk);
        if (!nameOk) valid = false;

        const emailOk = isValidEmail(emailInput.value.trim());
        setFieldError(emailInput, emailError, !emailOk);
        if (!emailOk) valid = false;

        const passwordOk = passwordInput.value.length >= 8;
        setFieldError(passwordInput, passwordError, !passwordOk);
        if (!passwordOk) valid = false;

        const confirmOk =
          confirmInput.value === passwordInput.value &&
          confirmInput.value.length > 0;
        setFieldError(confirmInput, confirmError, !confirmOk);
        if (!confirmOk) valid = false;

        const termsOk = termsInput.checked;
        termsError.style.display = termsOk ? "none" : "block";
        if (!termsOk) valid = false;

        if (!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Criando conta...";

        try {
          // Endpoint assumido: POST /register — ajuste a URL/campos conforme sua rota real
          const res = await fetch("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              name: nameInput.value.trim(),
              email: emailInput.value.trim().toLowerCase(),
              password: passwordInput.value,
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            showServerMsg(
              data.message || "Conta criada com sucesso!",
              "success",
            );
            // user disponível em data.user: { id, name, email }
            window.location.href = "/login";
          } else {
            // Espera-se 400 para validação/email já cadastrado, 500 para erro interno
            showServerMsg(
              data.error || "Não foi possível criar a conta. Tente novamente.",
              "error",
            );
          }
        } catch (err) {
          showServerMsg(
            "Erro de conexão com o servidor. Tente novamente.",
            "error",
          );
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Criar conta";
        }
      });

      document.getElementById("googleBtn").addEventListener("click", () => {
        window.location.href = "/auth/google";
      });
    </script>
  </body>
</html>
